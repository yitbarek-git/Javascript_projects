<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My cat</title>
    <style>
      body {
        padding-top: 80px;
        background: rgb(47, 47, 20);
        min-height: 100vh;
      }

      img {
        width: 80px;
        position: relative;
        border-radius: 50%;
      }

      p {
        text-align: center;
      }
      .title{
        position: fixed;
        top: -10px;
        left:10px;
        right: 12px;
        bottom: 20px;
      }
    </style>
  </head>

  <body>
    <p class="title">Animation using javascript.</p>

    <p>
      <img src="code.png" alt="My picture">
    </p>
    <script>
      let cat = document.querySelector("img");
      let angle = Math.PI / 2;
      function animate(time, lastTime) {
        if (lastTime != null) {
          angle += (time - lastTime) * .001;
        }
        cat.style.top = (Math.sin(angle) * 100) + "px";
        cat.style.left = (Math.cos(angle) * 150) + "px";
        requestAnimationFrame(newTime => animate(newTime, time));
      }
      requestAnimationFrame(animate);

    </script>
  </body>

</html>
