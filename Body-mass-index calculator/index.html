<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI (Body-Mass- index) calculator</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="container">
      <h1>body mass index (BMI) calculator </h2>
        <p>your Height (cm)</p>
        <input type="number" id="height" value="170" placeholder="Enter your height.">
        <p>your weight (cm)</p>
        <input type="number" id="weight" value="60" placeholder="Enter your weignt.">
        <button id="compute-btn">compute BMI</button>

        <input type="number" id="result-btn">
        <p class="info-text">weight condition : <span id="weight-condition"></span></p>
    </div>
    <script src="index.js"></script>
  </body>
</html>
