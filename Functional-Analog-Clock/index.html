<!DOCTYPE html>
<html lang="en">

  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fully Functional Analog Clock project</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <div class="container">
      <div class="numbers">
        <div class="twelve">12</div>
        <div class="three">3</div>
        <div class="six">6</div>
        <div class="nine">9</div>
      </div>

      <div class="arrows">
        <div id="hour"></div>
        <div id="minute"></div>
        <div id="second"></div>
      </div>

      <div class="middle-anchor"></div>

    </div>
    <script src="index.js"></script>
  </body>

</html>
