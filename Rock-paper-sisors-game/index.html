<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <div class="container">
        <h1>Rock Paper Scissors</h1>
        
        <div class="scoreboard">
            <div class="score">
                <span>You: </span>
                <span id="player-score">0</span>
            </div>
            <div class="score">
                <span>Computer: </span>
                <span id="computer-score">0</span>
            </div>
        </div>

        <div class="choices">
            <button class="choice-btn" data-choice="rock">🪨 Rock</button>
            <button class="choice-btn" data-choice="paper">📄 Paper</button>
            <button class="choice-btn" data-choice="scissors">✂️ Scissors</button>
        </div>

        <div class="result" id="resultBtn">
            Choose your move!
        </div>

        <div class="game-info">
            <p>You picked: <span id="player-choice">-</span></p>
            <p>Computer picked: <span id="computer-choice">-</span></p>
        </div>

        <button class="reset-btn" id="resetBtn">Reset Game</button>
    </div>

    <script src="index.js"></script>
</body>
</html>
