<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOM manipulation in JS</title>

    <style>
      *,
      *::before,
      *::after {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        margin: 5rem;
      }

      #container {
        border: 1px solid red;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin: 5rem;
        width: 15rem;
        height: 15rem;
      }

      button {
        margin: 0.5rem;
        padding: 0.5rem;
      }
      #mybutton {
        border-radius: 10px;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 1.5rem;
        font-weight: 700;
      }
      #mybutton:hover,
      #mybutton:hover {
        font-size: 1.8rem;
      }
    </style>
  </head>
  <body>
    <h1>DOM manipulation in JS</h1>
    <div id="container">
      <button id="mybutton">Roll</button>
      <button id="label1"></button>
      <button id="label2"></button>
      <button id="label3"></button>
    </div>
  </body>

  <script defer>
    "use strict";
    const mybutton = document.getElementById("mybutton");
    const label1 = document.getElementById("label1");
    const label2 = document.getElementById("label2");
    const label3 = document.getElementById("label3");
    const newButton = document.getElementById("newButton");

    function rollDice(min, max) {
      return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    mybutton.addEventListener("click", () => {
      label1.textContent = rollDice(1, 6);
      label2.textContent = rollDice(1, 6);
      label3.textContent = rollDice(1, 6);
    });
  </script>
</html>
